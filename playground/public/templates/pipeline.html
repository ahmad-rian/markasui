...JSON.parse(document.getElementById('pipeline-data').textContent),
page: 'workspace',
leadId: 'l1',
meetingId: 'm2',
callOpen: true,

readHash() {
const id = window.location.hash.slice(1);
return id in this.pages ? id : 'workspace';
},
go(id) {
window.location.assign('#' + id);
},
current(id) {
return this.page === id ? 'page' : null;
},
notify(title, description = '', variant = 'default') {
this.$dispatch('markas-toast', { title, description, variant });
},

initials(name) {
return name.split(' ').filter((_, index, words) => index === 0 || index === words.length - 1).map((word) => word.charAt(0)).join('').toUpperCase();
},

faceTone(name) {
return this.faceTones[[...name].reduce((sum, char) => sum + char.charCodeAt(0), 0) % this.faceTones.length];
},
rupiah(value) {
return 'Rp ' + value.toLocaleString('id-ID');
},
plural(count, word) {
return count + ' ' + word + (count === 1 ? '' : 's');
},
at(hour) {
return ((hour - this.DAY_START) / this.DAY_HOURS) * 100 + '%';
},
leadById(id) {
return this.leads.find((item) => item.id === id);
},
get lead() {
return this.leadById(this.leadId);
},
get meeting() {
return this.meetings.find((item) => item.id === this.meetingId);
},
matchesLead(lead, filter) {
return filter === 'all' || lead.interest === filter;
},
openLead(id) {
this.leadId = id;
document.getElementById('pipeline-lead-drawer').showModal();
},
pickMeeting(id) {
this.meetingId = id;
this.callOpen = true;
},
}"

<div
x-data="{
toasts: [],
timers: {},
nextId: 0,
variants: JSON.parse('{\u0022default\u0022:\u0022border-line\u0022,\u0022success\u0022:\u0022border-success\\\/40\u0022,\u0022danger\u0022:\u0022border-danger\\\/40\u0022}'),
iconVariants: JSON.parse('{\u0022default\u0022:\u0022\u0022,\u0022success\u0022:\u0022text-success\u0022,\u0022danger\u0022:\u0022text-danger\u0022}'),
icons: JSON.parse('{\u0022default\u0022:\u0022\u0022,\u0022success\u0022:\u0022M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM8.5 12l2.5 2.5 4.5-5\u0022,\u0022danger\u0022:\u0022M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM15 9l-6 6M9 9l6 6\u0022}'),
add(detail) {
const variant = detail.variant in this.variants ? detail.variant : 'default';
const duration = Number.isFinite(detail.duration) ? detail.duration : 5000;
const id = ++this.nextId;
this.toasts = [...this.toasts, { id, title: String(detail.title ?? ''), description: detail.description ?? '', variant }];
if (duration > 0) this.start(id, duration);
},
start(id, ms) {
this.timers[id] = { handle: setTimeout(() => this.dismiss(id), ms), remaining: ms, startedAt: Date.now() };
},
dismiss(id) {
clearTimeout(this.timers[id]?.handle);
delete this.timers[id];
this.toasts = this.toasts.filter((item) => item.id !== id);
},
pause(id) {
const timer = this.timers[id];
if (!timer?.handle) return;
clearTimeout(timer.handle);
this.timers[id] = { remaining: timer.remaining - (Date.now() - timer.startedAt), startedAt: 0 };
},
resume(id) {
const timer = this.timers[id];
if (!timer || timer.handle) return;
this.start(id, Math.max(timer.remaining, 0));
},
}"
x-init="[].forEach((detail) => add(detail))"
x-on:markas-toast.window="add($event.detail ?? {})"
class="pointer-events-none fixed right-4 bottom-4 z-50 flex w-[calc(100%-2rem)] max-w-sm flex-col gap-2" role="status" aria-live="polite" aria-label="Notifications"
>
<template x-for="item in toasts" :key="item.id">
<div
data-state="open"
class="pointer-events-auto flex items-start gap-3 rounded-lg border bg-surface p-4 text-sm text-ink shadow-overlay transition-[opacity,translate] duration-200 ease-out starting:translate-y-2 starting:opacity-0 motion-reduce:transition-none"
:class="variants[item.variant]"
x-on:mouseenter="pause(item.id)"
x-on:mouseleave="if (! $el.contains(document.activeElement)) resume(item.id)"
x-on:focusin="pause(item.id)"
x-on:focusout="if (! $el.contains($event.relatedTarget) && ! $el.matches(':hover')) resume(item.id)"
>
<template x-if="icons[item.variant]">
<svg class="mt-0.5 size-4 shrink-0" :class="iconVariants[item.variant]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path :d="icons[item.variant]" /></svg>
</template>
<div class="grid flex-1 gap-1">
<p class="font-semibold" x-text="item.title"></p>
<template x-if="item.description">
<p class="text-muted" x-text="item.description"></p>
</template>
</div>
<button type="button" class="-mt-1 -mr-1 inline-flex size-6 shrink-0 items-center justify-center rounded-md text-muted transition-colors duration-150 ease-out hover:bg-subtle hover:text-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary motion-reduce:transition-none" aria-label="Close" x-on:click="dismiss(item.id)">
<svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
</button>
</div>
</template>
