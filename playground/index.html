<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground MarkasUI</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="p-8">
    <main class="grid gap-4">
      <h1 class="text-2xl font-bold">Playground MarkasUI</h1>
      <p class="text-muted">
        Satu contoh, tiga framework. Tambahkan
        <code>&amp;theme=dark</code> untuk mode gelap.
      </p>
      <ul id="links" class="grid gap-2 font-mono text-sm"></ul>
    </main>
    <script type="module">
      const components = Object.keys(
        import.meta.glob("../examples/react/*.tsx"),
      ).map((path) => path.split("/").at(-1).replace(".tsx", ""));
      const links = components.flatMap((c) =>
        ["blade", "react", "vue"].map(
          (fw) =>
            `<li><a class="text-primary underline" href="/${fw}.html?c=${c}">${fw} / ${c}</a></li>`,
        ),
      );
      document.getElementById("links").innerHTML = links.join("");
    </script>
  </body>
</html>
