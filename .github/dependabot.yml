version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    # Composite action di .github/actions/setup tidak ikut terbaca dari "/" saja.
    directories: ["/", "/.github/actions/setup"]
    schedule:
      interval: weekly
