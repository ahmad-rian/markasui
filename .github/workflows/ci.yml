name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec vitest run --coverage

  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-components
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Blade components inside a real Laravel + Livewire app (created during the job, not a repo dependency).
  livewire:
    name: livewire ${{ matrix.livewire }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        livewire: [3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-livewire-${{ matrix.livewire }}-${{ github.run_id }}
          restore-keys: composer-livewire-${{ matrix.livewire }}-
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:livewire
        env:
          LIVEWIRE: ${{ matrix.livewire }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm thumbs
      - run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - run: pnpm size
      - run: pnpm test:docs
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
      - uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: apps/docs/dist
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-docs
          path: |
            playwright-report-docs/
            test-results/
          retention-days: 7
