name: CI

on:
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec vitest run --coverage

  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-components
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm thumbs
      - run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - run: pnpm size
      - run: pnpm test:docs
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
      - uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: apps/docs/dist
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-docs
          path: |
            playwright-report-docs/
            test-results/
          retention-days: 7
