name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing: npm menerima token OIDC dari GitHub Actions, tanpa secret NPM_TOKEN.
      # Hanya job ini yang butuh token OIDC, job CI tidak.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Versi tag harus sama dengan versi paket
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in packages/cli packages/mcp; do
            version=$(node -p "require('./$pkg/package.json').version")
            [ "$version" = "$tag" ] || { echo "::error::$pkg versi $version, tag $tag"; exit 1; }
          done
      - run: pnpm build:packages
      # pnpm pack mengganti workspace:* dengan versi asli; npm publish memakai Trusted Publishing (npm 11.5.1+)
      # dan otomatis menambahkan provenance. npm bawaan Node 26 (11.x) sudah cukup: tidak memasang npm@latest
      # yang tidak terkunci di job yang memegang token OIDC.
      - name: Publish ke npm
        run: |
          npm --version
          mkdir -p .release
          (cd packages/cli && pnpm pack --pack-destination ../../.release)
          (cd packages/mcp && pnpm pack --pack-destination ../../.release)
          npm publish .release/markasui-*.tgz --access public
          npm publish .release/markasui-mcp-*.tgz --access public
