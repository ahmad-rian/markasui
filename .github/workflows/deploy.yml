name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  pages:
    needs: ci
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: dist
      - name: Lewati deploy (secret Cloudflare belum diisi)
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::Isi secret CLOUDFLARE_API_TOKEN dan CLOUDFLARE_ACCOUNT_ID untuk mengaktifkan deploy."
      - uses: cloudflare/wrangler-action@v4
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=markasui --branch=main
