name: Laporan bug
description: Komponen tidak bekerja seperti seharusnya
labels: [bug]
body:
  - type: input
    id: component
    attributes: { label: Komponen, placeholder: "modal" }
    validations: { required: true }
  - type: dropdown
    id: framework
    attributes: { label: Framework, options: [Blade, React, Vue] }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      {
        label: Langkah reproduksi,
        description: "Apa yang Anda lakukan, apa yang terjadi, dan apa yang diharapkan.",
      }
    validations: { required: true }
  - type: input
    id: browser
    attributes: { label: Browser dan versi }
