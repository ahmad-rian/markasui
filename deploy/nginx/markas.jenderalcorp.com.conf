# MarkasUI docs: https://markas.jenderalcorp.com
# Static Astro build, synced to /var/www/markasui by scripts/deploy.sh.
# Live copy: /etc/nginx/sites-available/markas.jenderalcorp.com (install with `pnpm deploy:site --nginx`).
#
# Every header is added once at server level. Values that differ per path come from the maps below, because an
# add_header inside a location drops all server-level add_header directives (nginx 1.28 has no inheritance).

# Content-Security-Policy value ($markas_csp_policy), generated from the build by apps/docs/scripts/csp.ts and
# installed by scripts/deploy.sh on every deploy.
include /etc/nginx/snippets/markas-csp.conf;

# The policy only matters for documents, so assets and JSON do not carry the 5 KB header.
map $sent_http_content_type $markas_csp {
    ~^text/html  $markas_csp_policy;
    default      "";
}

map $uri $markas_cache_control {
    ~^/_astro/  "public, max-age=31536000, immutable";
    ~^/r/       "public, max-age=300";
    ~^/og/      "public, max-age=86400";
    default     "";
}

# /r/* is the public registry read by the CLI and MCP server from any origin.
map $uri $markas_cors_origin {
    ~^/r/    "*";
    default  "";
}
map $uri $markas_cors_methods {
    ~^/r/    "GET, HEAD, OPTIONS";
    default  "";
}

map "$request_method $status" $markas_allow {
    "~^OPTIONS "  "GET, HEAD, OPTIONS";
    "~ 405$"      "GET, HEAD, OPTIONS";
    default       "";
}

# Per client IP. A page load is about 30 requests and /components lazy-loads ~110 thumbnails, so the burst is
# generous; mobile carriers put many people behind one IP. Clients that keep hitting it are banned for an hour by
# the fail2ban nginx-limit-req jail (/etc/fail2ban/jail.d/markas-nginx.local).
limit_req_zone $binary_remote_addr zone=markas_req:10m rate=30r/s;

server {
    server_name markas.jenderalcorp.com;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    http2 on;
    ssl_certificate /etc/letsencrypt/live/markas.jenderalcorp.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/markas.jenderalcorp.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    root /var/www/markasui;
    index index.html;
    autoindex off;

    # Static site: no request bodies, short timeouts.
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;

    limit_req zone=markas_req burst=300 nodelay;
    limit_req_status 429;

    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }
    if ($request_method = OPTIONS) {
        return 204;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/markdown text/xml application/json application/javascript application/xml image/svg+xml application/manifest+json;

    # includeSubDomains covers *.markas.jenderalcorp.com only (none exist), not other jenderalcorp.com hosts.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $markas_csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "accelerometer=(), browsing-topics=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), serial=(), usb=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cache-Control $markas_cache_control always;
    add_header Access-Control-Allow-Origin $markas_cors_origin always;
    add_header Access-Control-Allow-Methods $markas_cors_methods always;
    add_header Allow $markas_allow always;

    # Hidden files and folders (/.git, /.env, the generated .csp-nginx.conf). Listed first: regex locations match
    # in order and win over the prefix locations below.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # build.format "file" + trailingSlash "never": /components/footer -> components/footer.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    location ~* \.md$ {
        types { } default_type "text/markdown; charset=utf-8";
    }
    location ~ ^/(id/)?llms(-full)?\.txt$ {
        types { } default_type "text/plain; charset=utf-8";
    }
    location = /site.webmanifest {
        types { } default_type application/manifest+json;
    }

    error_page 404 /404.html;
}

server {
    if ($host = markas.jenderalcorp.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name markas.jenderalcorp.com;
    return 404; # managed by Certbot
}
